<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="theme-color" content="#73d8e9"><title>Hope Creator · Smilemates</title><link rel="stylesheet" href="./studio/style.css"><link rel="stylesheet" href="./studio/island.css"></head><body><div id="hc-root">
<nav class="island-controls" aria-label="보기 방식"><div class="view-switch"><button id="world-view" class="selected" aria-pressed="true">섬</button><button id="grid-view" aria-pressed="false">카드 모아보기</button></div><div class="utility-controls"><button id="motion-toggle" class="utility-button" aria-label="움직임 멈추기" title="움직임 멈추기">Ⅱ</button><button id="qr-open" class="utility-button" aria-label="휴대폰 접속 QR" title="휴대폰 접속 QR"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h2v2h-2zM19 15h2v6h-6v-2h4z"/></svg></button></div></nav>
<main><div class="world" id="world"><div class="island-stage" id="island-stage"><img class="island-landscape" src="./studio/assets/island.svg" alt=""><div id="avatars" class="avatars"></div></div></div><div id="card-grid" class="card-grid" hidden></div><div id="empty-state" hidden></div><div id="connection-notice" class="connection-notice" hidden></div></main>
<div class="my-card-dock"><button id="dock-button" class="button primary">내 카드 만들기</button></div>
<dialog id="editor" class="editor-dialog"><div class="dialog-header"><h2>자기소개 카드</h2><button class="icon-button close-editor" aria-label="카드 만들기 닫기">×</button></div><form id="profile-form" class="resume-sheet">
<div class="resume-top">
  <button id="character-preview" class="resume-photo" type="button" aria-label="필수 항목 작성 후 나의 캐릭터 그리기">
    <span id="preview-art"></span>
    <span id="photo-lock" class="photo-lock"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="14" width="18" height="14" rx="4"/><path d="M11 14v-4a5 5 0 0 1 10 0v4"/><path d="M16 20v3"/></svg><span class="sr-only">필수 항목 작성 후 열림</span></span>
    <span class="photo-edit">나를 그려요 <span aria-hidden="true">✎</span></span>
  </button>
  <div class="resume-info">
    <label class="resume-row"><span>이름</span><input name="name" id="name-input" maxlength="12" placeholder="눌러서 입력" required autocomplete="nickname"></label>
    <div class="resume-dopamine"><label for="dopamine-input">나의 도파민 <span class="field-count" data-count-for="dopamine-input">0/30</span></label><textarea name="dopamine" id="dopamine-input" maxlength="30" rows="3" placeholder="눌러서 입력" required></textarea></div>
  </div>
</div>
<section class="resume-section">
  <h3>지금의 나</h3>
  <div class="resume-mate-row"><span>나와 닮은 메이트</span><button type="button" class="mate-select-button" id="choose-mate" aria-haspopup="dialog">메이트 선택 <span aria-hidden="true">＋</span></button></div>
  <label class="resume-prompt" for="experience-input">메이트와 닮은 나의 경험 <span class="field-count" data-count-for="experience-input">0/80</span></label>
  <textarea name="experience" id="experience-input" maxlength="80" rows="3" placeholder="눌러서 입력" required></textarea>
</section>
<section class="resume-section">
  <h3>앞으로의 나</h3>
  <div class="resume-mate-row"><span>닮고 싶은 메이트</span><button type="button" class="mate-select-button" id="choose-aspiration" aria-haspopup="dialog">메이트 선택 <span aria-hidden="true">＋</span></button></div>
  <label class="resume-prompt" for="attempts-input">이를 위해 하고 있는 시도 <small>선택</small><span class="field-count" data-count-for="attempts-input">0/40</span></label>
  <textarea name="attempts" id="attempts-input" maxlength="40" rows="2" placeholder="눌러서 입력"></textarea>
</section>
<section class="resume-section">
  <h3><label for="concern-input">요즘 진로 고민</label><span class="field-count" data-count-for="concern-input">0/60</span></h3>
  <textarea name="concern" id="concern-input" maxlength="60" rows="3" placeholder="눌러서 입력" required></textarea>
</section>
<div class="form-end"><p id="form-error" role="alert" class="form-error" hidden></p><button type="submit" class="button primary full" id="submit-profile">저장</button></div></form></dialog>
<dialog id="mate-dialog" class="editor-dialog mate-dialog"><div class="dialog-header"><h2 id="mate-picker-title">메이트 선택</h2><button type="button" class="icon-button" id="mate-close" aria-label="메이트 선택 닫기">×</button></div><div class="mate-picker-body"><div id="mate-options" class="mate-options"></div></div></dialog>
<dialog id="character-dialog" class="editor-dialog character-dialog"><div class="dialog-header"><h2>나를 그려요</h2><button type="button" class="icon-button" id="character-close" aria-label="캐릭터 편집 닫기">×</button></div><div class="character-body"><div class="drawing-layout"><aside class="drawing-reference"><div id="reference-mate" aria-label="참고 메이트"></div></aside><details id="drawing-details" open><summary><span>직접 그리기</span><span aria-hidden="true">✎</span></summary><div class="drawing-tools"><div id="pen-colors" class="pen-colors"></div><button type="button" id="thin-pen" class="tool selected" aria-pressed="true">가는 펜</button><button type="button" id="thick-pen" class="tool" aria-pressed="false">굵은 펜</button></div><div class="canvas-wrap"><canvas id="drawing" width="600" height="600" aria-label="캐릭터 그림판"></canvas><span class="canvas-hint" id="canvas-hint"></span></div><div class="drawing-actions"><button type="button" id="undo-drawing" class="text-button">되돌리기</button><button type="button" id="clear-drawing" class="text-button">모두 지우기</button></div></details></div><button type="button" id="character-done" class="button primary full">완료</button></div></dialog>
<dialog id="profile-dialog" class="profile-dialog"><div class="profile-controls"><span id="profile-kind" class="preview-label"></span><button class="icon-button" id="close-profile" aria-label="소개 카드 닫기">×</button></div><article id="profile-card" class="profile-card"></article><div id="reaction-stage" class="reaction-stage" aria-live="polite"></div><div id="reaction-buttons" class="reaction-buttons"><button data-reaction="empathy" type="button" aria-label="공감해">❤️ 공감</button><button data-reaction="cool" type="button" aria-label="멋져">👏 멋져</button><button data-reaction="cheer" type="button" aria-label="응원해">🙌 응원</button><button data-reaction="curious" type="button" aria-label="궁금해">💭 궁금해</button></div><div class="profile-actions"><button class="button" id="edit-profile">수정</button><button class="button" id="save-image">이미지 저장</button><button class="button primary" id="present-card">크게 보기</button></div></dialog>
<dialog id="qr-dialog" class="qr-dialog"><button id="qr-close" class="icon-button" aria-label="QR 닫기">×</button><img src="./studio/assets/join-qr.svg" alt="휴대폰 접속 QR"><a href="./">휴대폰 접속</a></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div></div><script type="module" src="./studio/app.js"></script></body></html>
