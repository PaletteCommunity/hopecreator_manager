<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="theme-color" content="#e39a54"><title>Hope Creator · Smilemates</title><link rel="stylesheet" href="./studio/style.css"><link rel="stylesheet" href="./studio/island.css"><link rel="stylesheet" href="./studio/fonts.css"></head><body><div id="hc-root">
<nav class="island-controls" aria-label="보기 방식"><div class="view-switch"><button type="button" id="world-view" class="selected" aria-pressed="true" aria-label="섬 보기" title="섬 보기"><svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16M15 5v16"/></svg></button><button type="button" id="grid-view" aria-pressed="false" aria-label="카드 모아보기" title="카드 모아보기"><svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 2-2 13 2-2 15-2 1"/><rect x="3" y="5" width="13" height="16" rx="2"/><path d="M7 16h5M7 18h3"/><circle cx="9.5" cy="11" r="2.5"/></svg></button></div><div class="utility-controls"><button id="motion-toggle" class="utility-button" aria-label="움직임 멈추기" title="움직임 멈추기">Ⅱ</button><button id="qr-open" class="utility-button" aria-label="휴대폰 접속 QR" title="휴대폰 접속 QR"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h2v2h-2zM19 15h2v6h-6v-2h4z"/></svg></button></div></nav>
<main><div class="world" id="world"><div class="island-stage" id="island-stage"><img class="island-landscape" src="./studio/assets/island.svg" alt=""><div id="avatars" class="avatars"></div></div></div><div id="card-grid" class="card-grid" hidden></div><div id="empty-state" hidden></div><div id="connection-notice" class="connection-notice" hidden></div></main>
<div class="my-card-dock"><button id="dock-button" class="button primary"><svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="9" r="2.5"/><path d="M8 17c.4-2.1 1.8-3.2 4-3.2s3.6 1.1 4 3.2"/></svg><span class="caption">내 카드 만들기</span></button></div>
<dialog id="editor" class="editor-dialog"><div class="dialog-header"><h2>자기소개 카드</h2><button class="icon-button close-editor" aria-label="카드 만들기 닫기">×</button></div><form id="profile-form" class="resume-sheet">
<div class="resume-top">
  <button id="character-preview" class="resume-photo" type="button" aria-label="필수 항목 작성 후 나의 캐릭터 그리기">
    <span id="preview-art"></span>
    <span id="photo-lock" class="photo-lock"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="14" width="18" height="14" rx="4"/><path d="M11 14v-4a5 5 0 0 1 10 0v4"/><path d="M16 20v3"/></svg><span class="sr-only">필수 항목 작성 후 열림</span></span>
    <span class="photo-edit" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 10-10a2.1 2.1 0 0 1 3 3L8 18l-5 2zM13.5 6.5l3 3M5 15l3 3"/></svg></span>
  </button>
  <div class="resume-info">
    <label class="resume-row"><span>이름</span><input name="name" id="name-input" maxlength="12" placeholder="눌러서 입력" required autocomplete="nickname"></label>
    <label class="resume-row"><span>나의 관심 직무</span><input name="jobInterest" id="jobInterest-input" maxlength="30" placeholder="눌러서 입력" required></label>
    <div class="resume-dopamine"><label for="dopamine-input">요즘 나의 가장 큰 도파민은? <span class="field-count" data-count-for="dopamine-input">0/30</span></label><textarea name="dopamine" id="dopamine-input" maxlength="30" rows="3" placeholder="눌러서 입력" required></textarea></div>
  </div>
</div>
<section class="resume-section">
  <h3>나를 가장 잘 보여주는 스마일메이츠는?</h3>
  <div class="resume-mate-row"><span>나와 닮은 메이트</span><button type="button" class="mate-select-button" id="choose-mate" aria-haspopup="dialog">메이트 선택 <span aria-hidden="true">＋</span></button></div>
  <label class="resume-prompt" for="experience-input">이 메이트의 가치를 잘 보여주는 나의 경험은? <span class="field-count" data-count-for="experience-input">0/80</span></label>
  <textarea name="experience" id="experience-input" maxlength="80" rows="3" placeholder="눌러서 입력" required></textarea>
</section>
<section class="resume-section">
  <h3>앞으로 닮아가고 싶은 스마일메이츠는?</h3>
  <div class="resume-mate-row"><span>닮고 싶은 메이트</span><button type="button" class="mate-select-button" id="choose-aspiration" aria-haspopup="dialog">메이트 선택 <span aria-hidden="true">＋</span></button></div>
  <label class="resume-prompt" for="attempts-input"><span class="prompt-copy">관련해서 최근에 하고 있는 시도가 있다면 적어주세요.<span class="prompt-subtext">아직 없다면 앞으로 해보고 싶은 일을 적어주어도 좋아요.</span></span><span class="field-count" data-count-for="attempts-input">0/40</span></label>
  <textarea name="attempts" id="attempts-input" maxlength="40" rows="2" placeholder="눌러서 입력" required></textarea>
</section>
<section class="resume-section">
  <h3><label for="concern-input">요즘 진로와 관련해 가장 고민되거나 궁금한 점은?</label><span class="field-count" data-count-for="concern-input">0/60</span></h3>
  <textarea name="concern" id="concern-input" maxlength="60" rows="3" placeholder="눌러서 입력" required></textarea>
</section>
<div class="form-end"><p id="form-error" role="alert" class="form-error" hidden></p><button type="submit" class="button primary full" id="submit-profile">저장</button></div></form></dialog>
<dialog id="mate-dialog" class="editor-dialog mate-dialog"><div class="dialog-header"><h2 id="mate-picker-title">메이트 선택</h2><button type="button" class="icon-button" id="mate-close" aria-label="메이트 선택 닫기">×</button></div><div class="mate-picker-body"><div id="mate-options" class="mate-options"></div></div></dialog>
<dialog id="character-dialog" class="editor-dialog character-dialog"><div class="dialog-header"><h2 aria-label="캐릭터 그리기"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 14 8-11a2 2 0 0 1 3 3L10 16M4 20c5 1 7-1 7-4a3 3 0 0 0-6 0c0 2-1 3-2 4zM13 10l3 3"/></svg></h2><button type="button" class="icon-button" id="character-close" aria-label="캐릭터 편집 닫기">×</button></div><div class="character-body"><div class="drawing-layout"><aside class="drawing-reference"><div id="reference-mate" aria-label="참고 메이트"></div></aside><details id="drawing-details" open><summary><span>직접 그리기</span><span aria-hidden="true">✎</span></summary><div class="drawing-tools"><div id="pen-colors" class="pen-colors"></div><button type="button" id="thin-pen" class="tool selected" aria-pressed="true">가는 펜</button><button type="button" id="thick-pen" class="tool" aria-pressed="false">굵은 펜</button></div><div class="canvas-wrap"><canvas id="drawing" width="600" height="600" aria-label="캐릭터 그림판"></canvas><span class="canvas-hint" id="canvas-hint"></span></div><div class="drawing-actions"><button type="button" id="undo-drawing" class="text-button">되돌리기</button><button type="button" id="clear-drawing" class="text-button">모두 지우기</button></div></details></div><button type="button" id="character-done" class="button primary full">완료</button></div></dialog>
<dialog id="profile-dialog" class="profile-dialog"><div class="profile-controls"><span id="profile-kind" class="preview-label"></span><button class="icon-button" id="close-profile" aria-label="소개 카드 닫기">×</button></div><article id="profile-card" class="profile-card"></article><div id="reaction-stage" class="reaction-stage" aria-live="polite"></div><div id="reaction-buttons" class="reaction-buttons"><button data-reaction="empathy" type="button" aria-label="공감해">❤️ 공감</button><button data-reaction="cool" type="button" aria-label="멋져">👏 멋져</button><button data-reaction="cheer" type="button" aria-label="응원해">🙌 응원</button><button data-reaction="curious" type="button" aria-label="궁금해">💭 궁금해</button></div><div class="profile-actions"><button class="button" id="edit-profile">수정</button><button class="button" id="save-image">이미지 저장</button><button class="button primary" id="present-card">크게 보기</button></div></dialog>
<dialog id="qr-dialog" class="qr-dialog"><button id="qr-close" class="icon-button" aria-label="QR 닫기">×</button><img src="./studio/assets/join-qr.svg" alt="휴대폰 접속 QR"><a href="./">휴대폰 접속</a></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div></div><script type="module" src="./studio/app.js"></script></body></html>
