<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" role="img" aria-labelledby="island-title">
  <title id="island-title">밝은 바다 위 모래와 잔디로 이루어진 작은 섬</title>
  <defs>
    <clipPath id="island-edge">
      <ellipse cx="550" cy="600" rx="470" ry="130"/>
    </clipPath>
    <clipPath id="grass-edge">
