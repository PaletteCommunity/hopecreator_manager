<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hope Creator 예산 신청</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

.hc-root {
  --bg: #FAFCFA;
  --surface: #FFFFFF;
  --surface-2: #F1F6F2;
  --surface-3: #E4EEE6;
  --border: rgba(20,40,25,0.10);
  --text: #16241C;
  --text-muted: #5C6E62;
  --text-faint: #8CA093;
  --violet: #1E9E5A;
  --c-yellow: #C98A00;
  --c-blue: #2E7FB0;
  --c-orange: #D9631E;
  --c-green: #1E9E5A;
  --c-pink: #C23D6C;
  --c-teal: #1E9E8A;
  --c-red: #D33B3B;
  --radius: 14px;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.hc-root * { box-sizing: border-box; }
.hc-root .disp { font-family: 'Fraunces', serif; }
.hc-root .mono { font-family: 'IBM Plex Mono', monospace; }
.hc-shell { max-width: 900px; margin: 0 auto; padding: 26px 18px 90px; }

/* Header */
.hc-header { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
.hc-brand { display:flex; align-items:center; gap:12px; }
.hc-logo { width:38px; height:38px; flex-shrink:0; }
.hc-title { font-size:21px; font-weight:600; letter-spacing:-0.01em; }
.hc-sub { color:var(--text-muted); font-size:12px; margin-top:1px; }
.hc-backbtn { background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
.hc-backbtn:hover { background:var(--surface-3); }

/* Home grid */
.hc-guidebar { display:flex; justify-content:flex-end; margin-bottom:14px; }
.hc-teamrow { display:grid; gap:12px; margin-bottom:12px; }
.hc-teamrow[data-cols="3"] { grid-template-columns:repeat(3,1fr); }
.hc-teamrow[data-cols="4"] { grid-template-columns:repeat(4,1fr); }
@media (max-width:560px){ .hc-teamrow[data-cols="3"], .hc-teamrow[data-cols="4"] { grid-template-columns:repeat(2,1fr); } }
.hc-teambtn { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px 10px; text-align:center; cursor:pointer; font-family:inherit; transition:all .15s; }
.hc-teambtn:hover { border-color:var(--violet); transform:translateY(-2px); background:var(--surface-2); }
.hc-teambtn .emoji { font-size:26px; display:block; margin-bottom:8px; }
.hc-teambtn .name { font-weight:700; font-size:14.5px; color:var(--text); display:block; }
.hc-teambtn .org { font-size:11px; color:var(--text-muted); margin-top:3px; display:block; }

/* Cards / buttons */
.hc-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
.hc-panel-title { font-size:15px; font-weight:700; margin-bottom:4px; }
.hc-panel-desc { color:var(--text-muted); font-size:12.5px; margin-bottom:14px; }
.hc-btn { font-family:inherit; font-size:13px; font-weight:600; border-radius:9px; padding:9px 15px; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; }
.hc-btn-primary { background:var(--violet); color:#fff; }
.hc-btn-primary:hover { background:#188049; }
.hc-btn-ghost { background:var(--surface-2); color:var(--text); border-color:var(--border); }
.hc-btn-ghost:hover { background:var(--surface-3); }
.hc-btn-green { background:rgba(76,175,125,0.15); color:#6FDA9F; border-color:rgba(76,175,125,0.35); }
.hc-btn-orange { background:rgba(242,118,46,0.15); color:#FBA05C; border-color:rgba(242,118,46,0.35); }
.hc-btn-red { background:rgba(229,72,77,0.15); color:#F58A8D; border-color:rgba(229,72,77,0.35); }
.hc-btn-sm { padding:6px 11px; font-size:12px; }
.hc-btn-block { width:100%; justify-content:center; }
.hc-btn:disabled { opacity:.4; cursor:not-allowed; }

/* Dashboard banner */
.hc-dashboard { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
@media (max-width:520px){ .hc-dashboard{ grid-template-columns:1fr; } }

.hc-monthgrid-title { font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:9px; }
.hc-monthgrid { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:18px; }
@media (max-width:760px){ .hc-monthgrid{ grid-template-columns:repeat(3,1fr); } }
@media (max-width:420px){ .hc-monthgrid{ grid-template-columns:repeat(2,1fr); } }
.hc-monthbox { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 10px; text-align:center; }
.hc-monthbox.is-current { border-color:var(--violet); background:var(--surface-2); }
.hc-monthbox-label { font-size:11px; color:var(--text-muted); font-weight:600; margin-bottom:5px; }
.hc-monthbox-val { font-family:'IBM Plex Mono'; font-size:14px; font-weight:600; }
.hc-dbox { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
.hc-dbox-label { font-size:11.5px; color:var(--text-muted); font-weight:600; margin-bottom:6px; }
.hc-dbox-val { font-family:'IBM Plex Mono'; font-size:24px; font-weight:600; }
.hc-dbox-cap { font-size:11px; color:var(--text-faint); margin-top:4px; }
.hc-capbar { width:100%; height:6px; background:var(--surface-3); border-radius:99px; overflow:hidden; margin-top:9px; }
.hc-capbar-fill { height:100%; border-radius:99px; }

/* Forms */
.hc-field { margin-bottom:14px; }
.hc-label { display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
.hc-label .req { color:var(--c-pink); }
.hc-input, .hc-select, .hc-textarea {
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:10px 12px; font-family:inherit; font-size:13.5px; outline:none;
}
.hc-input:focus, .hc-textarea:focus { border-color:var(--violet); background:var(--surface-3); }
.hc-textarea { resize:vertical; min-height:60px; }
.hc-row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:560px){ .hc-row2{ grid-template-columns:1fr; } }

.hc-pillrow { display:flex; flex-wrap:wrap; gap:6px; }
.hc-pill { position:relative; }
.hc-pill input { position:absolute; opacity:0; }
.hc-pill span { display:inline-block; padding:6px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); font-size:12.5px; cursor:pointer; color:var(--text-muted); }
.hc-pill input:checked + span { background:var(--violet); border-color:var(--violet); color:#fff; font-weight:600; }

.hc-itemblock { border:1px solid var(--border); border-radius:11px; padding:13px 14px; margin-bottom:10px; background:var(--surface-2); }
.hc-itemblock-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.hc-itemblock-idx { font-size:11px; color:var(--text-faint); font-weight:700; }
.hc-itemrow-del { background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:15px; }
.hc-itemrow-del:hover { color:var(--c-pink); }
.hc-total-line { display:flex; justify-content:space-between; align-items:center; padding:12px 4px 4px; border-top:1px dashed var(--border); margin-top:6px; }
.hc-total-amt { font-family:'IBM Plex Mono'; font-size:17px; font-weight:600; }
.hc-warn { background:rgba(242,118,46,0.12); border:1px solid rgba(242,118,46,0.3); color:#FBA05C; font-size:12px; padding:9px 12px; border-radius:8px; margin-top:8px; }

/* Progress + badges */
.hc-trail { display:flex; align-items:center; gap:5px; }
.hc-dot { width:9px; height:9px; border-radius:50%; background:rgba(20,40,25,0.12); }
.hc-dot.filled { background:var(--dot-color, var(--violet)); }
.hc-dot.current { box-shadow:0 0 0 4px color-mix(in srgb, var(--dot-color) 25%, transparent); }
.hc-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap; }
.hc-badge-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.hc-negtag { display:inline-flex; align-items:center; gap:4px; background:rgba(242,118,46,0.15); color:#FBA05C; padding:2px 9px; border-radius:99px; font-size:10.5px; font-weight:700; margin-left:6px; }

/* Request cards */
.hc-reqcard { border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; background:var(--surface-2); }
.hc-reqcard-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.hc-reqcard-title { font-weight:700; font-size:14.5px; margin-bottom:2px; }
.hc-reqcard-meta { font-size:12px; color:var(--text-muted); }
.hc-negolog { background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin-top:10px; max-height:180px; overflow-y:auto; }
.hc-negomsg { font-size:12.5px; margin-bottom:8px; }
.hc-negomsg b { color:var(--violet); }
.hc-negomsg .t { color:var(--text-faint); font-size:10.5px; margin-left:6px; }
.hc-rejbanner { background:rgba(229,72,77,0.12); border:1px solid rgba(229,72,77,0.3); color:#F58A8D; font-size:12.5px; padding:10px 12px; border-radius:9px; margin-top:8px; }
.hc-receiptbox { background:var(--surface); border:1px dashed var(--border); border-radius:9px; padding:12px; margin-top:10px; }
.hc-receiptimg { max-width:220px; border-radius:8px; display:block; margin-top:8px; border:1px solid var(--border); }
.hc-attlist { margin-top:8px; }
.hc-attrow { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 2px; font-size:12.5px; border-bottom:1px dashed var(--border); }
.hc-attrow:last-child { border-bottom:none; }
.hc-filelabel { display:inline-flex; align-items:center; gap:6px; background:var(--surface-3); border:1px solid var(--border); border-radius:8px; padding:8px 13px; font-size:12.5px; cursor:pointer; }
.hc-filelabel input { display:none; }

.hc-testpanel { margin-top:12px; border:1px dashed rgba(30,158,90,0.4); border-radius:9px; padding:10px 12px; background:rgba(30,158,90,0.06); }
.hc-testpanel summary { cursor:pointer; font-size:11px; color:var(--violet); font-weight:700; }
.hc-testpanel .body { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

.hc-hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
.hc-empty { text-align:center; padding:40px 20px; color:var(--text-muted); }
.hc-empty .disp { font-size:17px; color:var(--text); margin-bottom:6px; }
.hc-modal-bg { position:fixed; inset:0; background:rgba(10,11,16,0.7); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
.hc-modal { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; max-width:560px; width:100%; }
.hc-modal-close { background:none; border:none; color:var(--text-muted); font-size:20px; cursor:pointer; }
.hc-guidetext { font-size:13.5px; color:var(--text); white-space:pre-line; line-height:1.8; }

/* Admin */
.hc-statrow { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
@media (max-width:520px){ .hc-statrow{ grid-template-columns:1fr; } }
.hc-statbox { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; }
.hc-statbox-label { font-size:11.5px; color:var(--text-muted); font-weight:600; margin-bottom:6px; }
.hc-statbox-val { font-family:'IBM Plex Mono'; font-size:26px; font-weight:600; }
.hc-atable-wrap { width:100%; overflow-x:auto; }
.hc-atable { width:100%; border-collapse:collapse; font-size:12.5px; }
.hc-atable td.mono, .hc-atable th.num { white-space:nowrap; }
.hc-atable th { text-align:left; color:var(--text-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--border); }
.hc-atable td { padding:9px 10px; border-bottom:1px solid var(--border); }
.hc-atable tr:last-child td { border-bottom:none; }
.hc-atable input { width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:5px 7px; font-family:inherit; font-size:12px; color:var(--text); }
.hc-listrow { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:11px; margin-bottom:8px; background:var(--surface-2); cursor:pointer; transition:all .12s; }
.hc-listrow:hover { border-color:var(--violet); }
.hc-listrow-main { display:flex; flex-direction:column; gap:2px; }
.hc-listrow-team { font-weight:700; font-size:13.5px; }
.hc-listrow-meta { font-size:11.5px; color:var(--text-muted); }
.hc-listrow-right { display:flex; align-items:center; gap:10px; }
.hc-listrow-amt { font-family:'IBM Plex Mono'; font-size:13px; }
.hc-exportpanel { display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
.hc-collapsible summary { cursor:pointer; font-size:12.5px; font-weight:700; color:var(--violet); padding:4px 0; }

.hc-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:99px; font-size:13px; z-index:80; box-shadow:0 8px 24px rgba(0,0,0,.3); }
.hc-loading { display:flex; align-items:center; justify-content:center; min-height:300px; color:var(--text-muted); font-size:13px; }
</style>
</head>

/* ============ SUPABASE DATA LAYER ============ */
var DRAFT_FIELDS_TO_PRESERVE = ['draftActualItems','draftAttachments','showPurchaseForm','draftActualPurchaseDate'];
function loadAll(){
  var prevById = {};
  (DATA.requests||[]).forEach(function(r){ prevById[r.id] = r; });
  return Promise.all([
    supabaseClient.from('teams').select('*'),
    supabaseClient.from('requests').select('*')
  ]).then(function(res){
    var teamsRes = res[0], reqsRes = res[1];
    if (teamsRes.error) throw teamsRes.error;
    if (reqsRes.error) throw reqsRes.error;
    DATA.teams = (teamsRes.data || []).map(teamFromDb);
    var freshRequests = (reqsRes.data || []).map(requestFromDb);
    // A background refresh must never wipe out edits the mentor hasn't submitted yet
    // (e.g. an added item or an uploaded receipt while filling out the purchase form),
    // since the freshly-fetched copy from the DB has no knowledge of unsaved drafts.
    freshRequests.forEach(function(r){
      var old = prevById[r.id];
      if (!old) return;
      DRAFT_FIELDS_TO_PRESERVE.forEach(function(f){ if (old[f]!=null) r[f] = old[f]; });
    });
    DATA.requests = freshRequests;
    if (!DATA.teams.length) {
      DATA.teams = TEAMS_FIXED;
      return saveTeams();
    }
  });
}
function saveTeams(){
  var rows = DATA.teams.map(teamToDb);
  return supabaseClient.from('teams').upsert(rows).then(function(res){
    if (res.error) { toast('저장 실패'); throw res.error; }
  });
}
function saveRequests(){
  var rows = DATA.requests.map(requestToDb);
  if (!rows.length) return Promise.resolve();
  return supabaseClient.from('requests').upsert(rows).then(function(res){
    if (res.error) { toast('저장 실패'); throw res.error; }
  });
}
function deleteRequestRemote(id){
  return supabaseClient.from('requests').delete().eq('id', id).then(function(res){
    if (res.error) { toast('삭제 실패'); throw res.error; }
  });
}
function deleteAllRequestsRemote(){
  return supabaseClient.from('requests').delete().neq('id', '__none__').then(function(res){
    if (res.error) { toast('삭제 실패'); throw res.error; }
  });
}
function uploadReceiptBlob(reqId, attId, blob, ext){
  var path = reqId + '/' + attId + ext;
  return supabaseClient.storage.from('receipts').upload(path, blob, { contentType: blob.type, upsert: true }).then(function(res){
    if (res.error) throw res.error;
    var pub = supabaseClient.storage.from('receipts').getPublicUrl(path);
    return pub.data.publicUrl;
  });
}

/* ============ HELPERS ============ */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtWon(n){ return (Number(n)||0).toLocaleString('ko-KR')+'원'; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowStamp(){ return new Date().toISOString().slice(0,16).replace('T',' '); }
function findTeam(id){ return DATA.teams.find(function(t){ return t.id===id; }); }
function teamReqs(teamId){ return DATA.requests.filter(function(r){ return r.teamId===teamId; }).sort(function(a,b){ return b.createdAt.localeCompare(a.createdAt); }); }
function itemsTotal(items){ return items.reduce(function(s,it){ return s+(Number(it.amount)||0); },0); }
function effectiveTotal(r){ return r.actualTotal!=null ? r.actualTotal : r.plannedTotal; }
function effectiveDate(r){ return r.actualPurchaseDate || r.activityDate; }
function isEditingLiveField(){ var a=document.activeElement; return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'); }
function toast(msg){ var el=document.createElement('div'); el.className='hc-toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(function(){ el.remove(); },2600); }

function monthTotal(teamId, mKey){
  return DATA.requests.filter(function(r){ return r.teamId===teamId && r.status!=='rejected' && (effectiveDate(r)||'').slice(0,7)===mKey; })
    .reduce(function(s,r){ return s+effectiveTotal(r); },0);
}
function thisMonthTotal(teamId){
  return monthTotal(teamId, todayStr().slice(0,7));
}
function allTimeTotal(teamId){
  return DATA.requests.filter(function(r){ return r.teamId===teamId && r.status!=='rejected'; })
    .reduce(function(s,r){ return s+effectiveTotal(r); },0);
}
function grandTotalAll(){ return DATA.teams.reduce(function(s,t){ return s+allTimeTotal(t.id); },0); }
function grandTotalThisMonth(){ return DATA.teams.reduce(function(s,t){ return s+thisMonthTotal(t.id); },0); }
var PENDING_WEIGHT = { submitted:0, negotiating:0, purchased:1, approved:2 };
function pendingRequests(){
  return DATA.requests.filter(function(r){ return PENDING_WEIGHT[r.status]!=null; })
    .sort(function(a,b){
      var w = PENDING_WEIGHT[a.status]-PENDING_WEIGHT[b.status];
      if (w!==0) return w;
      return (a.activityDate||'').localeCompare(b.activityDate||'');
    });
}
function completedRequests(){
  return DATA.requests.filter(function(r){ return r.status==='settled' || r.status==='rejected'; })
    .sort(function(a,b){ return (b.settledAt||b.rejectedAt||b.createdAt||'').localeCompare(a.settledAt||a.rejectedAt||a.createdAt||''); });
}
function daysUntil(dateStr){ if(!dateStr) return null; var d=new Date(dateStr+'T00:00:00'); var t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

        return '<div class="hc-attrow"><span>'+(a.type==='pdf'?'📄':'🖼️')+' '+esc(a.name)+'</span>' +
          '<button class="hc-btn hc-btn-ghost hc-btn-sm" onclick="HC.viewAdminAttachment(\''+r.id+'\',\''+a.id+'\')">보기</button></div>' +
          '<div id="adminattview_'+r.id+'_'+a.id+'"></div>';
      }).join('') + '</div>';
  }

  var actions = '';
  if (r.status==='submitted' || r.status==='negotiating') {
    actions = '<div class="hc-field"><label class="hc-label">협의/반려 메시지 (해당 액션 사용 시 입력)</label><textarea class="hc-textarea" id="adminMsg" placeholder="예) 이 물품 대신 OOO는 어떨까요? / 반려 사유"></textarea></div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
        '<button class="hc-btn hc-btn-green" onclick="HC.adminApprove(\''+r.id+'\')">승인</button>' +
        '<button class="hc-btn hc-btn-orange" onclick="HC.adminNegotiate(\''+r.id+'\')">협의 제안</button>' +
        '<button class="hc-btn hc-btn-red" onclick="HC.adminReject(\''+r.id+'\')">반려</button>' +
      '</div>';
  } else if (r.status==='approved') {
    actions = '<div class="hc-panel-desc hc-mb0">멘토가 구매를 진행할 때까지 대기 중이에요. (읽기 전용)</div>';
  } else if (r.status==='purchased') {
    actions = '<div class="hc-panel-desc" style="margin-bottom:10px;">멘토가 제출한 최종금액과 영수증을 확인한 후 정산을 완료해주세요. 영수증이 잘못됐거나 금액이 안 맞으면 보완을 요청할 수 있어요.</div>' +
      '<div class="hc-field"><label class="hc-label">보완 요청 메시지 (보완 요청 시 필수)</label><textarea class="hc-textarea" id="adminMsg" placeholder="예) 영수증 사진이 흐려서 안 보여요, 다시 올려주세요 / 3번 품목 금액이 신청 내역과 달라요"></textarea></div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
        '<button class="hc-btn hc-btn-primary" onclick="HC.adminSettle(\''+r.id+'\')">정산 완료 처리</button>' +
        '<button class="hc-btn hc-btn-orange" onclick="HC.adminRequestFix(\''+r.id+'\')">🔁 보완 요청</button>' +
      '</div>';
  } else if (r.status==='rejected') {
    actions = '<div class="hc-rejbanner">⛔ 반려됨 · 사유: '+esc(r.rejectReason||'-')+'</div>';
  } else {
    actions = '<div class="hc-panel-desc hc-mb0">✅ 정산이 완료된 건이에요.</div>';
  }

  return '<div class="hc-modal-bg" onclick="if(event.target===this) HC.closeAdminModal()">' +
    '<div class="hc-modal">' +
      '<div class="hc-modal-head" style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">' +
        '<div><div class="hc-panel-title" style="margin-bottom:2px;">'+team.emoji+' '+esc(team.name)+' · '+esc(r.round)+'</div>' +
        '<span class="hc-badge" style="background:color-mix(in srgb, '+meta.hex+' 18%, transparent); color:'+meta.hex+'"><span class="hc-badge-dot"></span>'+meta.label+'</span></div>' +
        '<button class="hc-modal-close" onclick="HC.closeAdminModal()">✕</button>' +
      '</div>' +
      '<div class="hc-kv" style="display:grid; grid-template-columns:90px 1fr; gap:6px 10px; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--text-muted)">구입 예정일자</b><span>'+esc(r.activityDate)+'</span></div>' +
      (r.actualPurchaseDate ? '<div class="hc-kv" style="display:grid; grid-template-columns:90px 1fr; gap:6px 10px; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--text-muted)">실제 구입일자</b><span>'+esc(r.actualPurchaseDate)+'</span></div>' : '') +
      '<div class="hc-kv" style="display:grid; grid-template-columns:90px 1fr; gap:6px 10px; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--text-muted)">학습목표</b><span>'+esc(r.objective)+'</span></div>' +
      '<div class="hc-kv" style="display:grid; grid-template-columns:90px 1fr; gap:6px 10px; font-size:12.5px; margin-bottom:4px;"><b style="color:var(--text-muted)">학습내용</b><span>'+esc(r.content)+'</span></div>' +
      '<div class="hc-hr"></div>' +
      '<div class="hc-panel-title" style="font-size:13px;">신청 예산 항목</div>' +
      '<table class="hc-itemtable" style="width:100%; border-collapse:collapse;"><thead><tr><th style="text-align:left; font-size:11px; color:var(--text-faint);">구분</th><th style="text-align:left; font-size:11px; color:var(--text-faint);">품목</th><th style="text-align:left; font-size:11px; color:var(--text-faint);">금액</th><th style="text-align:left; font-size:11px; color:var(--text-faint);">사유</th></tr></thead><tbody>'+itemsHtml+'</tbody></table>' +
      '<div class="hc-total-line"><span>계획 합계</span><span class="hc-total-amt">'+fmtWon(r.plannedTotal)+'</span></div>' +
      (r.actualItems && r.actualItems.length ? (
        '<div class="hc-hr"></div><div class="hc-panel-title" style="font-size:13px;">실제 구매 내역</div>' +
        '<table class="hc-itemtable" style="width:100%; border-collapse:collapse;"><thead><tr><th style="text-align:left; font-size:11px; color:var(--text-faint);">구분</th><th style="text-align:left; font-size:11px; color:var(--text-faint);">품목</th><th style="text-align:left; font-size:11px; color:var(--text-faint);">금액</th></tr></thead><tbody>' +
        r.actualItems.map(function(it){ return '<tr><td>'+esc(it.category)+'</td><td>'+esc(it.item)+'</td><td class="mono">'+fmtWon(it.amount)+'</td></tr>'; }).join('') +
        '</tbody></table>' +
        '<div class="hc-total-line"><span>실 구매 합계</span><span class="hc-total-amt">'+fmtWon(r.actualTotal)+'</span></div>'
      ) : '') +
      attHtml +
      (negoHtml ? '<div class="hc-hr"></div><div class="hc-panel-title" style="font-size:13px;">협의 내역</div>'+negoHtml : '') +
      '<div class="hc-hr"></div>' +
      actions +
    '</div>' +
  '</div>';
}


function renderMonthGrid(teamId){
  var curMonth = todayStr().slice(0,7);
  return '<div class="hc-monthgrid">' +
    PROGRAM_MONTHS.map(function(mKey){
      var isCurrent = mKey === curMonth;
      return '<div class="hc-monthbox'+(isCurrent?' is-current':'')+'">' +
        '<div class="hc-monthbox-label">'+programMonthLabel(mKey)+'</div>' +
        '<div class="hc-monthbox-val">'+fmtWon(monthTotal(teamId, mKey))+'</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

/* ============ TEAM PAGE ============ */
function renderTeamPage(){
  var team = findTeam(UI.currentTeamId);
  if (!team) { UI.screen='home'; return renderHome(); }
  var used = thisMonthTotal(team.id);
  var remain = MONTHLY_CAP - used;
  var pct = Math.min(100, Math.round(used/MONTHLY_CAP*100));
  var over = remain < 0;

  return '' +
  '<div class="hc-header">' +
    '<div class="hc-brand">'+renderLogo()+'<div><div class="hc-title disp">'+team.emoji+' '+esc(team.name)+'</div><div class="hc-sub">'+(team.orgName?esc(team.orgName)+' · ':'')+'이번 달 예산 현황과 신청 내역</div></div></div>' +
    '<button class="hc-backbtn" onclick="HC.goHome()">← 팀 홈으로</button>' +
  '</div>' +

  '<div class="hc-dashboard">' +
    '<div class="hc-dbox"><div class="hc-dbox-label">이번 달 신청 금액</div><div class="hc-dbox-val">'+fmtWon(used)+'</div>' +
      '<div class="hc-capbar"><div class="hc-capbar-fill" style="width:'+pct+'%; background:'+(over?'#D33B3B':'#1E9E5A')+'"></div></div>' +
      '<div class="hc-dbox-cap">월 한도 '+fmtWon(MONTHLY_CAP)+'</div></div>' +
    '<div class="hc-dbox"><div class="hc-dbox-label">이번 달 잔여 금액</div><div class="hc-dbox-val" style="color:'+(over?'#F58A8D':'var(--text)')+'">'+(over?'-':'')+fmtWon(Math.abs(remain)).replace('-','')+'</div>' +
      '<div class="hc-dbox-cap">'+(over ? '⚠️ 한도를 초과했어요 (담당자 승인 시 예외 진행 가능)' : '매월 1일 자동으로 다시 채워져요')+'</div></div>' +
  '</div>' +

  '<div class="hc-monthgrid-title">월별 사용 금액 (전체 프로그램 기간)</div>' +
  renderMonthGrid(team.id) +

  renderNewRequestForm(team) +

  '<div class="hc-panel-title" style="margin:22px 2px 12px;">신청 내역</div>' +
  renderHistory(team);
}

/* ============ NEW REQUEST FORM ============ */
function renderNewRequestForm(team){
  if (!draftItems.length) draftItems = [{ category:CATS[0], item:'', amount:'', reason:'' }];
  var isEdit = !!editingReqId;

  var roundPills = ROUNDS.map(function(rd){
    return '<label class="hc-pill"><input type="radio" name="roundpick" '+(draftFields.round===rd?'checked':'')+' onchange="HC.setField(\'round\',\''+rd+'\')"><span>'+rd+'</span></label>';
  }).join('');

  var itemBlocks = draftItems.map(function(it,i){
    var cats = CATS.map(function(c){
      return '<label class="hc-pill"><input type="radio" name="cat_'+i+'" '+(it.category===c?'checked':'')+' onchange="HC.updateItem('+i+',\'category\',\''+c+'\')"><span>'+c+'</span></label>';
    }).join('');
    return '<div class="hc-itemblock">' +
      '<div class="hc-itemblock-top"><span class="hc-itemblock-idx">항목 '+(i+1)+'</span>'+(draftItems.length>1?'<button class="hc-itemrow-del" onclick="HC.removeItem('+i+')">✕ 삭제</button>':'')+'</div>' +
      '<div class="hc-field"><label class="hc-label">구분 <span class="req">*</span></label><div class="hc-pillrow">'+cats+'</div></div>' +
      '<div class="hc-row2">' +
        '<div class="hc-field"><label class="hc-label">구입 품목 <span class="req">*</span></label><input class="hc-input" placeholder="예) 색연필 12색 3세트" value="'+esc(it.item)+'" oninput="HC.updateItemQuiet('+i+',\'item\',this.value)"></div>' +
        '<div class="hc-field"><label class="hc-label">소요 금액(원) <span class="req">*</span></label><input class="hc-input" type="number" placeholder="0" value="'+esc(it.amount)+'" oninput="HC.updateItemQuiet('+i+',\'amount\',this.value); HC.refreshTotal();"></div>' +
      '</div>' +
      '<div class="hc-field"><label class="hc-label">구매사유 및 활용 계획</label><textarea class="hc-textarea" style="min-height:44px;" oninput="HC.updateItemQuiet('+i+',\'reason\',this.value)">'+esc(it.reason)+'</textarea></div>' +
    '</div>';
  }).join('');

  var total = itemsTotal(draftItems);
  var used = thisMonthTotal(team.id) - (isEdit ? (DATA.requests.find(function(x){return x.id===editingReqId;})||{}).plannedTotal||0 : 0);
  var projected = used + total;
  var over = projected > MONTHLY_CAP;

  return '<div class="hc-card">' +
    '<div class="hc-panel-title">'+(isEdit?'신청서 수정 후 재제출':'새 신청서 작성')+'</div>' +
    '<div class="hc-panel-desc">HOPE CREATOR 교구구입 및 간식 구매 예산 신청서</div>' +

    '<div class="hc-field"><label class="hc-label">활동 회차 <span class="req">*</span></label><div class="hc-pillrow">'+roundPills+'</div></div>' +
    '<div class="hc-field"><label class="hc-label">구입 예정일자 <span class="req">*</span></label><input class="hc-input" type="date" id="f_activityDate" value="'+esc(draftFields.activityDate||'')+'" onchange="HC.setField(\'activityDate\',this.value)" style="max-width:220px;"></div>' +

    '<div class="hc-field"><label class="hc-label">학습 목표 <span class="req">*</span></label><textarea class="hc-textarea" id="f_objective" oninput="HC.setFieldQuiet(\'objective\',this.value)">'+esc(draftFields.objective||'')+'</textarea></div>' +
    '<div class="hc-field"><label class="hc-label">학습 내용 <span class="req">*</span></label><textarea class="hc-textarea" id="f_content" oninput="HC.setFieldQuiet(\'content\',this.value)">'+esc(draftFields.content||'')+'</textarea></div>' +

    '<div class="hc-hr"></div>' +
    '<div class="hc-panel-title" style="font-size:13.5px;">구매 예산 항목</div>' +
    itemBlocks +
    '<button class="hc-btn hc-btn-ghost hc-btn-sm" onclick="HC.addItem()">+ 항목 추가</button>' +
    '<div class="hc-total-line"><span>합계</span><span class="hc-total-amt" id="hcTotalAmt">'+fmtWon(total)+'</span></div>' +
    (over ? '<div class="hc-warn">⚠️ 이번 달 누적 신청액이 '+fmtWon(projected)+'로 월 한도 '+fmtWon(MONTHLY_CAP)+'을 초과해요. 그래도 제출은 가능하지만, 담당자와 사전 협의를 권장해요.</div>' : '') +

    '<div style="display:flex; gap:8px; margin-top:18px;">' +
      (isEdit ? '<button class="hc-btn hc-btn-ghost" onclick="HC.cancelEdit()">취소</button>' : '') +
      '<button class="hc-btn hc-btn-primary hc-btn-block" onclick="HC.submitForm()">'+(isEdit?'수정 내용 재제출':'담당자에게 신청서 제출')+'</button>' +
    '</div>' +
  '</div>';
}

/* ============ HISTORY ============ */
function renderHistory(team){
  var reqs = teamReqs(team.id);
  if (!reqs.length) return '<div class="hc-card hc-empty"><div class="disp">아직 신청 내역이 없어요</div>위 폼으로 첫 신청서를 제출해보세요.</div>';
  return reqs.map(renderReqCard).join('');
}

function renderReqCard(r){
  var meta = STATUS_META[r.status];
  var badge = '<span class="hc-badge" style="background:color-mix(in srgb, '+meta.hex+' 18%, transparent); color:'+meta.hex+'"><span class="hc-badge-dot"></span>'+meta.label+'</span>';

  var trailHtml = '';
  if (r.status !== 'rejected') {
    var idx = TRAIL.indexOf(r.status==='negotiating' ? 'submitted' : r.status);
    trailHtml = '<div class="hc-trail">' + TRAIL.map(function(key,i){
      var m = STATUS_META[key];
      return '<div class="hc-dot '+(i<=idx?'filled':'')+' '+(i===idx?'current':'')+'" style="--dot-color:'+m.hex+'" title="'+m.label+'"></div>';
    }).join('') + (r.status==='negotiating' ? '<span class="hc-negtag">💬 협의중 · 답변 필요</span>' : '') + '</div>';
  }

  var body = '';
  if (r.status==='rejected') {
    body = '<div class="hc-rejbanner">⛔ 반려되었어요 · 사유: '+esc(r.rejectReason||'-')+'</div>';
  } else if (r.status==='submitted') {
    body = (r.negotiationLog && r.negotiationLog.length ? '<div class="hc-negolog">'+r.negotiationLog.map(renderNegoMsg).join('')+'</div>' : '') +
      (UI.confirmingCancelId===r.id ?
        '<div class="hc-warn" style="margin-top:8px;">정말 이 신청을 취소할까요? 되돌릴 수 없어요.</div>' +
        '<div style="margin-top:6px; display:flex; gap:8px;">' +
          '<button class="hc-btn hc-btn-ghost hc-btn-sm" onclick="HC.setConfirmingCancel(null)">아니요</button>' +
          '<button class="hc-btn hc-btn-red hc-btn-sm" onclick="HC.cancelRequest(\''+r.id+'\')">예, 취소할게요</button>' +
        '</div>'
        :
        '<div style="margin-top:8px; display:flex; gap:8px;">' +
          '<button class="hc-btn hc-btn-ghost hc-btn-sm" onclick="HC.startResubmit(\''+r.id+'\')">✏️ 수정하기</button>' +
          '<button class="hc-btn hc-btn-red hc-btn-sm" onclick="HC.setConfirmingCancel(\''+r.id+'\')">신청 취소</button>' +
        '</div>' +
        '<div style="font-size:11px; color:var(--text-faint); margin-top:6px;">담당자가 아직 확인하기 전에는 자유롭게 수정하거나 취소할 수 있어요.</div>');
  } else if (r.status==='negotiating') {
    body = '<div class="hc-negolog">'+(r.negotiationLog||[]).map(renderNegoMsg).join('')+'</div>' +
      '<div class="hc-row2" style="margin-top:8px;">' +
        '<textarea class="hc-textarea" id="reply_'+r.id+'" placeholder="담당자에게 답변 남기기…" style="min-height:44px;"></textarea>' +
        '<div style="display:flex; flex-direction:column; gap:6px;">' +
          '<button class="hc-btn hc-btn-ghost hc-btn-sm" onclick="HC.replyNego(\''+r.id+'\')">답변 보내기</button>' +
          '<button class="hc-btn hc-btn-orange hc-btn-sm" onclick="HC.startResubmit(\''+r.id+'\')">항목 수정 후 재제출</button>' +
        '</div>' +
      '</div>';
  } else if (r.status==='approved') {
    body = (r.negotiationLog && r.negotiationLog.length ? '<div class="hc-negolog">'+r.negotiationLog.map(renderNegoMsg).join('')+'</div>' : '') +
      renderPurchaseForm(r);
  } else if (r.status==='purchased') {
    body = '<div class="hc-receiptbox">🕓 담당자 확인을 기다리고 있어요 · 제출한 최종금액 <b class="mono">'+fmtWon(r.actualTotal)+'</b>' +
      renderAttachmentList(r) + '</div>';
  } else if (r.status==='settled') {
    body = '<div class="hc-receiptbox">✅ 정산까지 모두 완료됐어요 · 최종금액 <b class="mono">'+fmtWon(r.actualTotal)+'</b>' +
      renderAttachmentList(r) + '</div>';
  }

  var itemsSummary = r.planItems.map(function(it){ return esc(it.item)+'('+esc(it.category)+') '+fmtWon(it.amount); }).join(' · ');

  return '<div class="hc-reqcard">' +
    '<div class="hc-reqcard-top">' +
      '<div><div class="hc-reqcard-title">'+esc(r.round)+' · 구입예정 '+esc(r.activityDate)+(r.actualPurchaseDate ? ' → 실구입 '+esc(r.actualPurchaseDate) : '')+'</div>' +
      '<div class="hc-reqcard-meta">'+itemsSummary+'</div>' +
      '<div class="hc-reqcard-meta">계획 합계 <b class="mono" style="color:var(--text)">'+fmtWon(r.plannedTotal)+'</b>'+(r.actualTotal!=null?' → 실사용 <b class="mono" style="color:var(--text)">'+fmtWon(r.actualTotal)+'</b>':'')+'</div></div>' +
      badge +
    '</div>' +
    trailHtml +
    body +
  '</div>';
}
function renderNegoMsg(m){
  return '<div class="hc-negomsg"><b>'+(m.author==='담당자'?'🗂 담당자':'🎨 멘토')+'</b> '+esc(m.message)+'<span class="t">'+esc(m.timestamp)+'</span></div>';
}

function renderPurchaseForm(r){
  if (!r.draftActualItems) {
    var base = (r.actualItems && r.actualItems.length) ? r.actualItems : r.planItems;
    r.draftActualItems = base.map(function(it){ return { category:it.category, item:it.item, amount:it.amount }; });
  }
  if (!r.draftActualPurchaseDate) r.draftActualPurchaseDate = r.actualPurchaseDate || r.activityDate;
  var itemRows = r.draftActualItems.map(function(it,i){
    var cats = CATS.map(function(c){ return '<option '+(c===it.category?'selected':'')+'>'+c+'</option>'; }).join('');
    return '<tr>' +
      '<td><select class="hc-select" onchange="HC.updateActualItem(\''+r.id+'\','+i+',\'category\',this.value)">'+cats+'</select></td>' +
      '<td><input class="hc-input" value="'+esc(it.item)+'" oninput="HC.updateActualItemQuiet(\''+r.id+'\','+i+',\'item\',this.value)"></td>' +
      '<td><input class="hc-input" type="number" value="'+it.amount+'" oninput="HC.updateActualItemQuiet(\''+r.id+'\','+i+',\'amount\',this.value); HC.refreshActualTotal(\''+r.id+'\');"></td>' +
      '<td>'+(r.draftActualItems.length>1?'<button class="hc-itemrow-del" onclick="HC.removeActualItem(\''+r.id+'\','+i+')">✕</button>':'')+'</td>' +
    '</tr>';
  }).join('');
  var atts = r.draftAttachments || [];
  var attList = atts.map(function(a){
    return '<div class="hc-attrow"><span>'+(a.type==='pdf'?'📄':'🖼️')+' '+esc(a.name)+'</span><button class="hc-itemrow-del" onclick="HC.removeDraftAttachment(\''+r.id+'\',\''+a.id+'\')">✕</button></div>';
  }).join('');
  return '<div class="hc-receiptbox">' +

var MAX_FILE_BYTES = 15 * 1024 * 1024; // 15MB per file — generous now that files live in real Supabase Storage (bucket default limit is 50MB)

function compressImageToBlob(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 1400, scale = Math.min(1, maxW/img.width);
        var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        var canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(function(blob){
          if (!blob) return reject(new Error('compression failed'));
          resolve(blob);
        }, 'image/jpeg', 0.72);
      };
      img.onerror = function(){ reject(new Error('image decode failed')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.readAsDataURL(file);
  });
}

HC.handleReceiptFiles = function(reqId, input){
  var r = DATA.requests.find(function(x){ return x.id===reqId; });
  if (!r.draftAttachments) r.draftAttachments = [];
  var files = Array.prototype.slice.call(input.files || []);
  input.value = ''; // allow re-selecting the same file later
  var tasks = files.map(function(file){
    var isPdf = file.type === 'application/pdf';
    var isImage = file.type.indexOf('image/') === 0;
    if (!isPdf && !isImage) { toast(file.name + ' — 이미지 또는 PDF만 업로드할 수 있어요'); return Promise.resolve(null); }
    if (isPdf && file.size > MAX_FILE_BYTES) { toast(file.name + ' — 파일이 너무 커요 (최대 15MB)'); return Promise.resolve(null); }
    var work = isPdf ? Promise.resolve(file) : compressImageToBlob(file);
    return work.then(function(blob){
      if (isImage && blob.size > MAX_FILE_BYTES) { toast(file.name + ' — 압축해도 파일이 너무 커요'); return null; }
      var attId = uid('att');
      var ext = isPdf ? '.pdf' : '.jpg';
      return uploadReceiptBlob(reqId, attId, blob, ext).then(function(url){
        return { id: attId, name: file.name, type: isPdf ? 'pdf' : 'image', url: url };
      });
    }).catch(function(){ toast(file.name + ' — 처리/업로드 중 오류가 발생했어요'); return null; });
  });
  Promise.all(tasks).then(function(results){
    results.filter(Boolean).forEach(function(att){ r.draftAttachments.push(att); });
    render();
  });
};

/* ============ MONTHLY SETTLEMENT EXPORT ============ */
HC.exportMonth = function(){
  var statusEl = document.getElementById('exportStatus');
  // UI.adminMonth에만 의존하지 않고, 클릭하는 순간 화면에 실제로 보이는 선택값을 직접 다시 읽어서 확정한다.
  // (자동 새로고침 등으로 상태가 어긋나는 경우를 방지하기 위한 방어 코드)
  var inputEl = document.getElementById('exportMonthInput');
  var month = (inputEl && inputEl.value) || UI.adminMonth || todayStr().slice(0,7);
  UI.adminMonth = month;
  var settled = DATA.requests.filter(function(r){ return r.status==='settled' && (effectiveDate(r)||'').slice(0,7)===month; })
    .sort(function(a,b){ return (effectiveDate(a)||'').localeCompare(effectiveDate(b)||''); });
  if (!settled.length) { statusEl.textContent = '해당 월에 정산완료된 건이 없어요.'; return; }
  if (typeof XLSX==='undefined' || typeof JSZip==='undefined') { statusEl.textContent = '내보내기 라이브러리를 불러오지 못했어요. 새로고침 후 다시 시도해주세요.'; return; }

  statusEl.textContent = '파일을 준비하고 있어요…';

  function orgOf(team){ return (team.orgName && team.orgName.trim()) ? team.orgName.trim() : team.name; }

  var teamGroups = {};
  settled.forEach(function(r){ (teamGroups[r.teamId] = teamGroups[r.teamId]||[]).push(r); });

  // ---- Sheet 1: 사용내역(세부) — 기관별 > 영수증(연번)별 > 품목별 행, 소계/합계 포함 ----
  var detailRows = [
    ['Hope Creator 커뮤니티 활동비('+month+') 사용 내역'],
    [],
    ['기관명','연번(영수증 번호)','결제일자','영수 금액','구분','사용 목적','품목','세부 금액']
  ];
  var detailMerges = [];
  var grandTotal = 0;

  DATA.teams.forEach(function(t){
    var reqs = teamGroups[t.id];
    if (!reqs || !reqs.length) return;
    var teamTotal = 0;
    var teamBlockStartRow = detailRows.length;
    reqs.forEach(function(r, ri){
      var items = (r.actualItems && r.actualItems.length) ? r.actualItems : r.planItems;
      var receiptAmt = r.actualTotal!=null ? r.actualTotal : r.plannedTotal;
      var receiptBlockStartRow = detailRows.length;
      items.forEach(function(it, ii){
        detailRows.push([
          (ri===0 && ii===0) ? orgOf(t) : '',
          ii===0 ? (ri+1) : '',
          ii===0 ? effectiveDate(r) : '',
          ii===0 ? receiptAmt : '',
          it.category,
          ii===0 ? (r.objective || '') : '',
          it.item,
          it.amount
        ]);
      });
      var receiptBlockEndRow = detailRows.length - 1;
      if (receiptBlockEndRow > receiptBlockStartRow) {
        [1,2,3,5].forEach(function(col){
          detailMerges.push({ s:{ r:receiptBlockStartRow, c:col }, e:{ r:receiptBlockEndRow, c:col } });
        });
      }
      teamTotal += receiptAmt;
    });
    var teamBlockEndRow = detailRows.length - 1;
    if (teamBlockEndRow > teamBlockStartRow) {
      detailMerges.push({ s:{ r:teamBlockStartRow, c:0 }, e:{ r:teamBlockEndRow, c:0 } });
    }
    detailRows.push(['', '소계','','','','','', teamTotal]);
    grandTotal += teamTotal;
  });
  detailRows.push(['합계','','','','','','', grandTotal]);

  // ---- Sheet 2: 지급 내용 ----
  var payRows = [
    ['Hope Creator 커뮤니티 활동비('+month+') 지급 내용'],
    [],
    ['연번','기관','지급처(팀별 대표 멘토)','은행','계좌번호','지급 금액']
  ];
  var payTotal = 0, payIdx = 0;
  DATA.teams.forEach(function(t){
    var reqs = teamGroups[t.id];
    if (!reqs || !reqs.length) return;
    var teamTotal = reqs.reduce(function(s,r){ return s + (r.actualTotal!=null?r.actualTotal:r.plannedTotal); },0);
    payIdx += 1;
    payRows.push([payIdx, orgOf(t), t.account.holder||'', t.account.bank||'', t.account.number||'', teamTotal]);
    payTotal += teamTotal;
  });
  payRows.push(['합계','','','','', payTotal]);

  var wb = XLSX.utils.book_new();
  var detailWs = XLSX.utils.aoa_to_sheet(detailRows);
  detailWs['!merges'] = detailMerges;
  XLSX.utils.book_append_sheet(wb, detailWs, '사용내역(세부)');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(payRows), '지급 내용');
  var xlsxBase64 = XLSX.write(wb, { bookType:'xlsx', type:'base64' });

  // ---- ZIP: 엑셀 요약 파일 + 기관명 폴더 / 사용일자_구입품목.ext ----
  // (엑셀과 zip을 따로 다운로드하면 브라우저가 두 번째 자동 다운로드를 차단할 수 있어서,
  //  하나의 zip 안에 엑셀 요약 파일까지 함께 넣어 한 번에 다운로드되게 함)
  var zip = new JSZip();
  zip.file('hope-creator-사용내역-'+month+'.xlsx', xlsxBase64, { base64:true });
  var attJobs = [];

  Object.keys(teamGroups).forEach(function(teamId){
    var team = findTeam(teamId) || { name:teamId, orgName:'' };
    var folder = zip.folder(orgOf(team));
    var usedNames = {};
    teamGroups[teamId].forEach(function(r){
      var items = (r.actualItems && r.actualItems.length) ? r.actualItems : r.planItems;
      var itemNames = items.map(function(it){ return it.item; }).join(',');
      (r.attachments||[]).forEach(function(a){
        attJobs.push(
          fetch(a.url).then(function(res){ return res.blob(); }).then(function(blob){
            var ext = (a.name.match(/\.[a-zA-Z0-9]+$/) || [a.type==='pdf' ? '.pdf' : '.jpg'])[0];
            var base = (effectiveDate(r) + '_' + itemNames).replace(/[\\/:*?"<>|]/g,'_').slice(0,80);
            var finalName = base + ext;
            var n = 2;
            while (usedNames[finalName]) { finalName = base + '_' + n + ext; n++; }
            usedNames[finalName] = true;
            folder.file(finalName, blob);
          }).catch(function(){ /* skip file that failed to fetch */ })
        );
      });
    });
  });

  Promise.all(attJobs).then(function(){
    return zip.generateAsync({ type:'base64' });
  }).then(function(zipBase64){
    downloadDataUri('data:application/zip;base64,'+zipBase64, 'hope-creator-정산자료-'+month+'.zip');
    statusEl.textContent = '정산자료 zip 다운로드가 시작됐어요 (엑셀 요약 + 증빙, '+settled.length+'건, '+Object.keys(teamGroups).length+'개 팀). 압축을 풀면 엑셀 파일과 기관별 폴더가 함께 들어있어요.';
  }).catch(function(){
    statusEl.textContent = '정산자료 zip 생성 중 문제가 발생했어요.';
  });
};

    'Supabase 대시보드 → Settings → API 에서 두 값을 복사해서 코드에 붙여넣어주세요.' +
    '</div></div>';

  });
  setInterval(function(){
    if (isEditingLiveField()) return;
    loadAll().then(render).catch(function(){});
  }, 6000);
}
